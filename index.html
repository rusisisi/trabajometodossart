 view(`<div class="c ct">${steps(3)}<h1 style="font-size:3em;color:var(--g)">${t('thanks')}</h1><div>${sub}</div><div id="stt" class="m"></div><button id="rt" class="go" hidden>${t('retry')}</button><div id="fbk2" hidden class="m">${window.FLANKER_EMAIL?window.FLANKER_EMAIL+'<br>':''}<button id="d1">${t('dl')}</button></div></div>`);
 $('d1').onclick=()=>{const q=getQ()[0]||S.last;if(!q)return;dl('sart_muestra.csv',csv([{...q.meta,...q.q,...q.s}]));setTimeout(()=>dl('sart_trials.csv',csv(q.trials)),400)};
 const send=async()=>{$('stt').textContent=t('sending');const r=await flush();
  $('stt').textContent={sent:t('sent')+(USER?' ('+(LG==='es'?'muestra nº ':'sample no. ')+USER+')':'')+'.',unconfirmed:t('unc')+(NET?' ('+NET+')':''),queued:t('fail'),local:t('local')}[r];
  $('rt').hidden=r!=='queued';$('fbk2').hidden=!(r==='queued'||r==='local'||r==='unconfirmed')};
 $('rt').onclick=send;await send()}
async function finish(rows){let s={};try{s=summarize(rows)}catch(e){showErr('resumen: '+e.message)}
 S.last={meta:{...S.meta,durationS:Math.round((performance.now()-S.t0)/1000)},q:ANS,s,trials:rows};setQ([...getQ(),S.last]);ls.set(DONE,'1');await thanks(t('done'))}
async function diag(){const d=document.createElement('pre');d.style.cssText='position:fixed;top:0;left:0;right:0;background:#222;color:#7CFC00;padding:8px;font:12px/1.4 monospace;z-index:99;white-space:pre-wrap;margin:0';document.body.appendChild(d);
 const g=async u=>{try{const r=await fetch(u,{signal:sig()});return r.status+' → '+(await r.text()).replace(/<[^>]*>/g,' ').trim().slice(0,150)}catch(e){return'ERROR: '+(e.message||e)}};
 d.textContent='DIAGNÓSTICO (correcto = "pong v5")\n'+await g(CFG.endpoint+'?action=ping')}
async function main(){
 if(Q.get('diag'))diag();if(Q.get('reset')){ls.del(DONE);ls.del(QK)}
 if(ls.get(DONE)){LG=(navigator.language||'es').startsWith('en')?'en':'es';await thanks(t('again'));return}
 await welcome();await questionnaire();await sartIntro();await sart(true);await sartMid();const rows=await sart(false);await finish(rows)}
main();
</script></body></html>
